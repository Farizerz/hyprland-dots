# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = bash -c "sleep 1 && waybar"
# exec-once = $HOME/.config/scripts/generate-wallpaper.sh
# exec-once = $HOME/.config/scripts/switch-monitor.sh
exec-once = bash -c " \
  $HOME/.config/scripts/generate-wallpaper.sh && \
  $HOME/.config/scripts/switch-monitor.sh && \
  hyprctl dispatch workspace 2 && \
  waybar \
"
exec-once = $HOME/.config/scripts/mount-drives.sh
exec-once = $HOME/.config/scripts/idle.sh
exec-once = $HOME/.config/scripts/limit-tdp.sh