# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

# Custom window rule
windowrule {
  name = windowrule-3
  opacity = 0.90 0.90
  match:class = ^(code|thunar|discord|steam|mousepad)$
}

windowrule {
  name = windowrule-4
  opacity = 0.90 0.90
  match:class = .*chrome-(chatgpt|netflix|canary\.discord|open\.spotify|web\.whatsapp|web\.telegram).*
}


# Hide windows with "hidden" in the title
windowrule {
  name = windowrule-5
  opacity = 0 0
  no_blur = on
  match:title = ^(hidden)$
}


# Floating windows
windowrule {
  name = windowrule-6
  float = on
  size = 800 600
  match:title = .*(Open File|Open Folder|Open|Save|Save As|Export|Import|Choose File|Rename|Copy|Move|Replace|File Operation Progress).*
  match:class = ^(.*)$
}

windowrule {
  name = windowrule-7
  float = on
  match:class = ^(org.gnome.Calculator|org.gnome.eog|org.pulseaudio.pavucontrol|Screensaver)$
}


# Floating window size
windowrule {
  name = windowrule-8
  size = 800 600
  match:class = ^(org.gnome.Calculator|org.gnome.eog|org.pulseaudio.pavucontrol)$
}


# Stay focused window
windowrule {
  name = windowrule-9
  stay_focused = on
  match:title = .*(Open File|Open Folder|Open|Save|Save As|Export|Import|Choose File|Rename|Copy|Move|Replace).*
  match:class = ^(.*)$
}

windowrule {
  name = windowrule-10
  stay_focused = on
  match:class = ^(org.pulseaudio.pavucontrol)$
}


# Tiling windows
windowrule {
  name = windowrule-11
  tile = on
  match:class = ^(scrcpy)$
}


# Fullscreen window
windowrule {
  name = windowrule-12
  fullscreen = on
  match:class = ^(Screensaver)$
}


# Bluetoothctl terminal
windowrule {
  name = windowrule-13
  workspace = special:hidden silent
  match:title = ^(bluetoothctl)$
}


# Screen sharing window rule on xwayland
windowrule {
  name = windowrule-14
  opacity = 0.0 override
  no_anim = on
  no_initial_focus = on
  max_size = 1 1
  no_blur = on
  no_focus = on
  match:class = ^(xwaylandvideobridge)$
}



