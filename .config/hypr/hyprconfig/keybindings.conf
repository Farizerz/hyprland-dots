### See https://wiki.hyprland.org/Configuring/Keywords/
$super = SUPER # Sets "Windows" key as main modifier
$alt = ALT # Sets "Alt" key key as an additional / navigation modifier

### See https://wiki.hyprland.org/Configuring/Binds/ for more

### Navigation
# Switch workspaces with ALT + [0-9]
bind = $alt, grave, workspace, 1 # Hidden Workspace
bind = $alt, 1, workspace, 2
bind = $alt, 2, workspace, 3
bind = $alt, 3, workspace, 4
bind = $alt, 4, workspace, 5
bind = $alt, 5, workspace, 6
bind = $alt, 6, workspace, 7
bind = $alt, 7, workspace, 8
bind = $alt, 8, workspace, 9
bind = $alt, 9, workspace, 10
bind = $alt, 0, workspace, 11

# Move active window to a workspace with ALT + SHIFT + [0-9]
bind = $alt SHIFT, grave, movetoworkspace, 1 # Hidden Workspace
bind = $alt SHIFT, 1, movetoworkspace, 2
bind = $alt SHIFT, 2, movetoworkspace, 3
bind = $alt SHIFT, 3, movetoworkspace, 4
bind = $alt SHIFT, 4, movetoworkspace, 5
bind = $alt SHIFT, 5, movetoworkspace, 6
bind = $alt SHIFT, 6, movetoworkspace, 7
bind = $alt SHIFT, 7, movetoworkspace, 8
bind = $alt SHIFT, 8, movetoworkspace, 9
bind = $alt SHIFT, 9, movetoworkspace, 10
bind = $alt SHIFT, 0, movetoworkspace, 11

# Switch focused window
bind = $alt, TAB, cyclenext

# Move focus with ALT + arrow keys
bind = $alt, left, movefocus, l
bind = $alt, right, movefocus, r
bind = $alt, up, movefocus, u
bind = $alt, down, movefocus, d

# Move windows using arrow keys
bind = $alt SHIFT, left, swapwindow, l
bind = $alt SHIFT, right, swapwindow, r
bind = $alt SHIFT, up, swapwindow, u
bind = $alt SHIFT, down, swapwindow, d
bind = $alt, F4, killactive,
bind = $alt, V, togglefloating,
bind = $alt SHIFT, P, pseudo, # dwindle
bind = $alt, J, togglesplit, # dwindle

# Resize windows with keys
binde = $alt,U,resizeactive,-30 0
binde = $alt,P,resizeactive,30 0
binde = $alt,I,resizeactive,0 -30
binde = $alt,O,resizeactive,0 30

# Scroll through existing workspaces with ALT + scroll
bind = $alt, mouse_down, workspace, e+1
bind = $alt, mouse_up, workspace, e-1

# Move/resize windows with ALT + LMB/RMB and dragging
bindm = $alt, mouse:272, movewindow
bindm = $alt, mouse:273, resizewindow

# Fullscreen window
bind = $alt, F, fullscreen
bind = , F11, fullscreen

### Main Modifier
bind = $super, Q, exec, $terminal
bind = $super, R, exec, $menu
bind = $super, E, exec, $fileManager
bind = $super, ESCAPE , exec, wlogout --buttons-per-row 6
bind = $super, P, exec, $HOME/.config/scripts/rofi-battery.sh
bind = $super, W, exec, $HOME/.config/scripts/rofi-wifi.sh
bind = $super, B, exec, $HOME/.config/scripts/rofi-bluetooth.sh
bind = $super, PERIOD, exec, rofi -show emoji -emoji-mode copy -theme-str 'prompt { enabled: false; }' -emoji-format '{emoji}' -theme "~/.config/rofi/themes/emoji.rasi"
bind = $super, TAB, exec, $HOME/.config/scripts/rofi-wallpaper.sh # Select wallpaper
bind = $super SHIFT, TAB, exec, $HOME/.config/scripts/change-wallpaper.sh # Shuffle random wallpaper
bind = $super, M, exec, $HOME/.config/scripts/toggle-mic.sh
bind = $super, PRINT, exec, grim - | wl-copy && notify-send "Screenshot copied to clipboard"
bind = $super SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $super, C, exec, hyprpicker -a
bind = $super, X, exec, waybar &
bind = $super SHIFT, X, exec, pkill waybar && waybar &
bind = $super, D, exec, $HOME/.config/scripts/toggle-monitor.sh

### Custom binds
bind = $super, 1, exec, $browser --profile-directory="Profile 1"
bind = $super, 2, exec, code 
bind = $super, 3, exec, $browser --profile-directory="Profile 2"

### Example special workspace (scratchpad)
bind = $alt, s, togglespecialworkspace, magic
bind = $alt SHIFT, S, movetoworkspace, special:magic

### Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

### Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

### Lid Switch
bindl = , switch:on:Lid Switch, exec, ~/.config/scripts/switch-monitor.sh
bindl = , switch:off:Lid Switch, exec, ~/.config/scripts/switch-monitor.sh
